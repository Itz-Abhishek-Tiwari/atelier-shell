# The edge spectrum (modules/spectrum/EdgeSpectrum.qml, services/Spectrum.qml): cava streams bar
# heights as text, one frame per line ("12;40;…;", 0..100). Runs only while the strip is shown.
[general]
bars = 64
framerate = 45
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 14000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 0.8
