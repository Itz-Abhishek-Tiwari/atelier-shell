# hypridle — idle actions: dim, lock, screen off, suspend
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Started from hyprland.lua (autostart). Anything holding an idle inhibitor pauses all of
# this: video/audio players, fullscreen windows (window rule), and the shell's Caffeine
# toggle (on automatically in Game/Dev mode).
#
# Note: Hyprland's config is Lua now, so `hyprctl dispatch` takes Lua dispatchers
# (`hyprctl dispatch dpms off` no longer works).

$LOCKSCREEN = qs ipc call lock lock || hyprlock   # quickshell lock screen, hyprlock fallback
$SCREEN_OFF = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
$SCREEN_ON  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

general {
    lock_cmd         = pidof hyprlock || $LOCKSCREEN   # `loginctl lock-session` lands here
    before_sleep_cmd = loginctl lock-session           # lock before suspend
    after_sleep_cmd  = $SCREEN_ON                      # screen back on after resume, no key press needed
    ignore_dbus_inhibit    = false                     # respect apps' idle inhibitors
    ignore_systemd_inhibit = false                     # respect systemd-inhibit --what=idle
}

# 60s: dim the screen (restored on any activity)
listener {
    timeout    = 60
    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume  = brightnessctl -r
}

# 120s: lock
listener {
    timeout    = 120
    on-timeout = loginctl lock-session
}

# 300s: screen off
listener {
    timeout    = 300
    on-timeout = $SCREEN_OFF
    on-resume  = $SCREEN_ON
}

# 500s: suspend
listener {
    timeout    = 500
    on-timeout = systemctl suspend
}
