# Atelier Music's visualizer (services/Cava.qml): cava streams bar heights as text, one frame per
# line, "12;40;…;" with values 0..100. Only runs while the visualizer is on screen.
[general]
bars = 48
framerate = 45
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 0.77
